<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merge Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-primary: #08080a;
            --bg-secondary: #0f0f12;
            --bg-card: rgba(255, 255, 255, 0.025);
            --bg-card-hover: rgba(255, 255, 255, 0.04);
            --accent-primary: #8b5cf6;
            --accent-secondary: #06ffa5;
            --accent-tertiary: #ff6b9d;
            --accent-cyan: #00d9ff;
            --loss: #ff4757;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --text-muted: #4a4a5a;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(139, 92, 246, 0.3);
            --gradient-1: linear-gradient(135deg, #8b5cf6 0%, #ff6b9d 100%);
            --gradient-2: linear-gradient(135deg, #06ffa5 0%, #00d9ff 100%);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Satoshi', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-mesh {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 255, 165, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 60%, rgba(255, 107, 157, 0.06) 0%, transparent 40%);
            animation: meshMove 20s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(2%, 2%); }
            66% { transform: translate(-1%, 1%); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px; right: -100px;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: rgba(6, 255, 165, 0.1);
            bottom: 10%; left: -50px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 16px 24px;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Clash Display', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }

        .logo-icon {
            width: 44px; height: 44px;
            background: var(--gradient-1);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .logo span {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            padding-top: 100px;
            padding-bottom: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero h1 .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .upload-zone {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: var(--radius-xl);
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent-primary);
            background: var(--bg-card-hover);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
        }

        .upload-zone.dragover { transform: scale(1.02); }

        .upload-icon { font-size: 4rem; margin-bottom: 16px; }

        .upload-title {
            font-family: 'Clash Display', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--gradient-1);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
        }

        #fileInput { display: none; }

        .selected-section { margin-bottom: 40px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Clash Display', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .selected-count { color: var(--text-secondary); font-size: 0.9rem; }

        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .pdf-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.3s ease;
        }

        .pdf-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .pdf-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .pdf-name {
            font-family: 'Clash Display', sans-serif;
            font-weight: 700;
            color: var(--accent-primary);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pdf-page-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .pdf-actions {
            display: flex;
            gap: 8px;
        }

        .pdf-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .pdf-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .pdf-btn.remove:hover {
            background: var(--loss);
            border-color: var(--loss);
        }

        .pdf-pages {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .page-thumb {
            aspect-ratio: 3/4;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-thumb:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.05);
        }

        .page-thumb.selected {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 12px rgba(6, 255, 165, 0.4);
        }

        .page-thumb.selected::after {
            content: '✓';
            position: absolute;
            top: 4px; right: 4px;
            width: 20px; height: 20px;
            background: var(--accent-secondary);
            border-radius: 50%;
            color: #000;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .page-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
        }

        .page-thumb .page-num {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .page-thumb .no-thumb {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .merge-section { text-align: center; }

        .merge-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 48px;
            background: var(--gradient-2);
            border: none;
            border-radius: var(--radius-lg);
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .merge-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(6, 255, 165, 0.4);
        }

        .merge-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .merge-btn .spinner {
            width: 20px; height: 20px;
            border: 2px solid transparent;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .merge-btn.loading .spinner { display: block; }
        .merge-btn.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-secondary);
            border-radius: var(--radius-md);
            color: var(--accent-secondary);
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error {
            border-color: var(--loss);
            color: var(--loss);
        }

        /* Preview Modal */
        .preview-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .preview-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .preview-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .preview-modal.active .preview-content { transform: scale(1); }

        .preview-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            font-family: 'Clash Display', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .preview-close {
            width: 36px; height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-close:hover {
            background: var(--loss);
            color: white;
            border-color: var(--loss);
        }

        .preview-canvas-container {
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            background: #1a1a1a;
        }

        #previewCanvas {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .preview-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-page-info { color: var(--text-secondary); font-size: 0.9rem; }

        .preview-actions { display: flex; gap: 12px; align-items: center; }

        .preview-nav { display: flex; gap: 8px; }

        .preview-nav-btn {
            width: 36px; height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-nav-btn:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .preview-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .preview-btn {
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preview-btn.select {
            background: var(--gradient-2);
            border: none;
            color: #000;
        }

        .preview-btn.select.selected { background: var(--accent-secondary); }

        .preview-btn.close-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .logo { font-size: 1.2rem; }
            .logo-icon { width: 36px; height: 36px; }
            main { padding-top: 80px; }
            .hero h1 { font-size: 1.8rem; }
            .upload-zone { padding: 40px 20px; }
            .pdf-pages { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <header>
        <a href="#" class="logo">
            <div class="logo-icon">📄</div>
            PDF Merge <span>By Prabh</span>
        </a>
    </header>

    <main>
        <section class="hero">
            <h1>Merge Your <span class="gradient-text">PDFs</span></h1>
            <p>Upload PDFs, select pages, and create your custom document</p>
        </section>

        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📁</div>
            <div class="upload-title">Drop your PDFs here</div>
            <div class="upload-subtitle">or click to browse files</div>
            <button class="upload-btn" id="selectBtn">
                <span>📂</span> Select PDFs
            </button>
            <input type="file" id="fileInput" accept=".pdf" multiple>
        </div>

        <section class="selected-section" id="selectedSection" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">Your PDFs</h2>
                <span class="selected-count" id="selectedCount">0 pages selected</span>
            </div>
            <div class="pdf-grid" id="pdfGrid"></div>
        </section>

        <section class="merge-section" id="mergeSection" style="display: none;">
            <button class="merge-btn" id="mergeBtn" onclick="mergePDFs()">
                <span class="spinner"></span>
                <span class="btn-text">✨ Merge & Download</span>
            </button>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <div class="preview-header">
                <span class="preview-title" id="previewTitle">Page Preview</span>
                <button class="preview-close" onclick="closePreview()">✕</button>
            </div>
            <div class="preview-canvas-container">
                <canvas id="previewCanvas"></canvas>
            </div>
            <div class="preview-footer">
                <div class="preview-nav">
                    <button class="preview-nav-btn" onclick="navPreview('first')" title="First">⏮</button>
                    <button class="preview-nav-btn" onclick="navPreview('prev')" title="Previous">◀</button>
                </div>
                <span class="preview-page-info" id="previewInfo">Page 1 of 1</span>
                <div class="preview-actions">
                    <button class="preview-btn select" id="previewSelectBtn" onclick="togglePreviewPage()">○ Select</button>
                    <button class="preview-nav-btn" onclick="navPreview('next')" title="Next">▶</button>
                    <button class="preview-nav-btn" onclick="navPreview('last')" title="Last">⏭</button>
                    <button class="preview-btn close-btn" onclick="closePreview()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfFiles = [];
        let currentPreview = { pdfIndex: 0, pageIndex: 0 };

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');

        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
            if (files.length) await loadPDFs(files);
        });

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
            if (files.length) await loadPDFs(files);
            fileInput.value = '';
        });

        async function loadPDFs(files) {
            showToast('Loading PDFs...');

            for (const file of files) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer);
                    const pageCount = pdfDoc.getPageCount();

                    const pdfJs = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;

                    pdfFiles.push({
                        name: file.name,
                        data: arrayBuffer.slice(0),
                        pageCount,
                        pdfJs,
                        pdfDoc,
                        pages: Array.from({ length: pageCount }, (_, i) => ({
                            index: i,
                            selected: false,
                            thumbnail: null
                        }))
                    });
                } catch (error) {
                    console.error('Error loading PDF:', file.name, error);
                    showToast(`Failed to load ${file.name}`, true);
                }
            }

            renderPDFs();
            renderThumbnails();
            showToast(`${files.length} PDF(s) loaded`);
        }

        async function renderThumbnails() {
            for (let pdfIdx = 0; pdfIdx < pdfFiles.length; pdfIdx++) {
                const pdf = pdfFiles[pdfIdx];
                for (let pageIdx = 0; pageIdx < pdf.pageCount; pageIdx++) {
                    if (pdf.pages[pageIdx].thumbnail) continue;
                    try {
                        const page = await pdf.pdfJs.getPage(pageIdx + 1);
                        const viewport = page.getViewport({ scale: 0.3 });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: ctx, viewport }).promise;
                        pdf.pages[pageIdx].thumbnail = canvas.toDataURL();
                    } catch (e) {
                        console.error('Thumbnail error:', e);
                    }
                }
            }
            renderPDFs();
        }

        function renderPDFs() {
            const grid = document.getElementById('pdfGrid');
            const selectedSection = document.getElementById('selectedSection');
            const mergeSection = document.getElementById('mergeSection');

            if (!pdfFiles.length) {
                selectedSection.style.display = 'none';
                mergeSection.style.display = 'none';
                return;
            }

            selectedSection.style.display = 'block';
            mergeSection.style.display = 'block';

            grid.innerHTML = pdfFiles.map((pdf, pdfIndex) => `
                <div class="pdf-card">
                    <div class="pdf-card-header">
                        <div>
                            <span class="pdf-name" title="${pdf.name}">${pdf.name}</span>
                            <span class="pdf-page-count">${pdf.pageCount} pages</span>
                        </div>
                        <div class="pdf-actions">
                            <button class="pdf-btn" onclick="selectAll(${pdfIndex})">☑ All</button>
                            <button class="pdf-btn" onclick="openPreview(${pdfIndex}, 0)">👁</button>
                            <button class="pdf-btn remove" onclick="removePDF(${pdfIndex})">✕</button>
                        </div>
                    </div>
                    <div class="pdf-pages">
                        ${pdf.pages.map((page, pageIndex) => `
                            <div class="page-thumb ${page.selected ? 'selected' : ''}"
                                 onclick="togglePage(${pdfIndex}, ${pageIndex})">
                                ${page.thumbnail ? `<img src="${page.thumbnail}">` : `<span class="no-thumb">${pageIndex + 1}</span>`}
                                <span class="page-num">${pageIndex + 1}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updateSelectedCount();
        }

        function togglePage(pdfIndex, pageIndex) {
            pdfFiles[pdfIndex].pages[pageIndex].selected = !pdfFiles[pdfIndex].pages[pageIndex].selected;
            renderPDFs();
        }

        function selectAll(pdfIndex) {
            const pdf = pdfFiles[pdfIndex];
            const allSelected = pdf.pages.every(p => p.selected);
            pdf.pages.forEach(p => p.selected = !allSelected);
            renderPDFs();
        }

        function removePDF(index) {
            pdfFiles.splice(index, 1);
            renderPDFs();
        }

        function updateSelectedCount() {
            const total = pdfFiles.reduce((sum, pdf) =>
                sum + pdf.pages.filter(p => p.selected).length, 0);
            document.getElementById('selectedCount').textContent = `${total} page${total !== 1 ? 's' : ''} selected`;
        }

        async function openPreview(pdfIndex, pageIndex) {
            currentPreview = { pdfIndex, pageIndex };
            const pdf = pdfFiles[pdfIndex];
            const page = pdf.pages[pageIndex];
            const modal = document.getElementById('previewModal');
            const title = document.getElementById('previewTitle');
            const info = document.getElementById('previewInfo');
            const selectBtn = document.getElementById('previewSelectBtn');
            const canvas = document.getElementById('previewCanvas');

            title.textContent = pdf.name;
            info.textContent = `Page ${pageIndex + 1} of ${pdf.pageCount}`;
            selectBtn.textContent = page.selected ? '✓ Selected' : '○ Select';
            selectBtn.classList.toggle('selected', page.selected);

            // Nav buttons
            const navBtns = document.querySelectorAll('.preview-nav-btn');
            navBtns[0].disabled = pageIndex === 0;
            navBtns[1].disabled = pageIndex === 0;
            navBtns[2].disabled = pageIndex === pdf.pageCount - 1;
            navBtns[3].disabled = pageIndex === pdf.pageCount - 1;

            try {
                const pdfPage = await pdf.pdfJs.getPage(pageIndex + 1);
                const viewport = pdfPage.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } catch (e) {
                console.error('Preview error:', e);
            }

            modal.classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function togglePreviewPage() {
            const { pdfIndex, pageIndex } = currentPreview;
            pdfFiles[pdfIndex].pages[pageIndex].selected = !pdfFiles[pdfIndex].pages[pageIndex].selected;
            renderPDFs();

            const page = pdfFiles[pdfIndex].pages[pageIndex];
            const selectBtn = document.getElementById('previewSelectBtn');
            selectBtn.textContent = page.selected ? '✓ Selected' : '○ Select';
            selectBtn.classList.toggle('selected', page.selected);
        }

        function navPreview(direction) {
            let { pdfIndex, pageIndex } = currentPreview;
            const pdf = pdfFiles[pdfIndex];

            if (direction === 'prev' && pageIndex > 0) pageIndex--;
            else if (direction === 'next' && pageIndex < pdf.pageCount - 1) pageIndex++;
            else if (direction === 'first') pageIndex = 0;
            else if (direction === 'last') pageIndex = pdf.pageCount - 1;

            if (pageIndex !== currentPreview.pageIndex) {
                openPreview(pdfIndex, pageIndex);
            }
        }

        document.getElementById('previewModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('preview-modal')) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('previewModal').classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') navPreview('prev');
            if (e.key === 'ArrowRight') navPreview('next');
            if (e.key === 'Enter') togglePreviewPage();
        });

        async function mergePDFs() {
            const mergeBtn = document.getElementById('mergeBtn');
            const selectedPages = [];

            pdfFiles.forEach((pdf, pdfIndex) => {
                pdf.pages.forEach((page, pageIndex) => {
                    if (page.selected) {
                        selectedPages.push({ pdfIndex, pageIndex });
                    }
                });
            });

            if (!selectedPages.length) {
                showToast('Please select at least one page', true);
                return;
            }

            mergeBtn.classList.add('loading');
            mergeBtn.disabled = true;

            try {
                const mergedPdf = await PDFDocument.create();

                // Group by source PDF
                const pagesByPdf = new Map();
                for (const p of selectedPages) {
                    if (!pagesByPdf.has(p.pdfIndex)) pagesByPdf.set(p.pdfIndex, []);
                    pagesByPdf.get(p.pdfIndex).push(p.pageIndex);
                }

                // Copy pages
                for (const [pdfIndex, pageIndices] of pagesByPdf) {
                    const pdf = pdfFiles[pdfIndex];
                    // Create fresh copy for this merge
                    const buffer = pdf.data.slice(0);
                    const sourceDoc = await PDFDocument.load(buffer);
                    const copied = await mergedPdf.copyPages(sourceDoc, pageIndices);
                    for (const p of copied) mergedPdf.addPage(p);
                }

                const mergedBytes = await mergedPdf.save();
                const blob = new Blob([mergedBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();
                URL.revokeObjectURL(url);

                showToast('PDF merged successfully! 🎉');
            } catch (error) {
                console.error('Merge error:', error);
                showToast('Error: ' + error.message, true);
            } finally {
                mergeBtn.classList.remove('loading');
                mergeBtn.disabled = false;
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
